[package]
name = "wasmtime-test"
version = "0.1.0"
edition = "2021"
description = "Multi-instance wasmtime test harness for witan-gossip"

[[bin]]
name = "gossip-node-test"
path = "src/main.rs"

[dependencies]
# wasmtime 25 matches the existing abi/rust/Cargo.toml version.
# wasmtime-wasi 25 provides WasiCtxBuilder + add_to_linker for WASI Preview 1.
wasmtime = { version = "25", features = ["cranelift"] }
wasmtime-wasi = { version = "25" }
anyhow = "1"
serde_json = "1"
hex = "0.4"
