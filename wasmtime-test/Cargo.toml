[package]
name = "wasmtime-test"
version = "0.1.0"
edition = "2021"
description = "Multi-instance wasmtime test harness for witan-gossip"

[[bin]]
name = "gossip-node-test"
path = "src/main.rs"

[dependencies]
# Component Model host bindings (wasmtime::component::bindgen!) plus the WASI
# p2 linker the component's std-supplied imports resolve against. Pinned to a
# single major so the p2 linker API can't shift underneath the harness.
wasmtime = { version = "48", features = ["cranelift", "component-model"] }
wasmtime-wasi = { version = "48" }
anyhow = "1"
serde_json = "1"
hex = "0.4"
