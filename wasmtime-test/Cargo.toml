[package]
name = "wasmtime-test"
version = "0.1.0"
edition = "2021"
description = "Multi-instance wasmtime test harness for witan"
license = "Apache-2.0 OR MIT"
# In-repo test harness, not a published artifact.
publish = false

[[bin]]
name = "gossip-node-test"
path = "src/main.rs"

[dependencies]
# Component Model host bindings (wasmtime::component::bindgen!) plus the WASI
# p2 linker the component's std-supplied imports resolve against. Pinned to a
# single major so the p2 linker API can't shift underneath the harness.
#
# Default features off, and only what the harness uses on: wasmtime's
# defaults include the on-disk compilation cache (which pulls in zstd), and
# wasmtime-wasi's include preview 1 (which pulls in wiggle and, through it,
# wasmtime's defaults again). The harness compiles in memory and links p2 only.
wasmtime = { version = "48", default-features = false, features = ["anyhow", "cranelift", "component-model", "runtime", "std"] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p2"] }
anyhow = "1"
serde_json = "1"
hex = "0.4"
