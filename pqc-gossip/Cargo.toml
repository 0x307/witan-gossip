[package]
name = "witan-gossip"
version = "0.1.0"
edition = "2021"
description = "Post-quantum cryptography gossip protocol WASM component (white-label gossip runtime)"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/0x307/witan-gossip"
readme = "README.md"
authors = ["0x307"]

# cargo-component metadata: declares the WIT package identity
[package.metadata.component]
package = "witan:gossip"

# No WIT component dependencies — pqc-kem and pqc-sig are Rust rlib deps
[package.metadata.component.dependencies]

# ---------------------------------------------------------------------------
# Library target
# ---------------------------------------------------------------------------
[lib]
name = "witan_gossip"
crate-type = ["cdylib", "rlib"]

# ---------------------------------------------------------------------------
# Core dependencies (compile for both WASM and native)
# ---------------------------------------------------------------------------
[dependencies]

# PQC KEM: X25519 + ML-KEM-768 hybrid (published crate; default features enable std)
pqc-kem = { version = "0.2" }

# PQC SIG: ML-DSA-65 (FIPS 204) (published crate; default features enable std)
pqc-sig = { version = "0.3" }

# Wire serialization (GossipEnvelope, handshake messages)
bincode = "1.3.3"

# Config and API response serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SHA-256 for message IDs, node IDs, transcript hashes
sha2 = { version = "0.10", default-features = false, features = ["oid"] }

# HKDF for session ID derivation
hkdf = "0.12"

# HMAC for server MAC in handshake finish ACK
hmac = "0.12"

# Hex encoding for node IDs, session IDs, public keys in JSON
hex = "0.4"

# Random number generation (nonces, key generation)
rand = { version = "0.8", default-features = false, features = ["getrandom"] }

# ---------------------------------------------------------------------------
# Target-specific dependencies
#
# Supported WASM target is wasm32-wasip2 (and wasm32-wasip1 for the deprecated
# `wasi-abi` surface). On both, getrandom and std's clock route through WASI —
# no entropy shim is required. wasm32-unknown-unknown is deliberately NOT
# supported: it has no WASI clock, so it would compile and then fail at
# runtime. Leaving it unconfigured makes that a loud build error instead.
# ---------------------------------------------------------------------------

# WASI target: getrandom uses the WASI random interface automatically
[target.'cfg(target_os = "wasi")'.dependencies]
getrandom = { version = "0.2" }

# ---------------------------------------------------------------------------
# WASM Component Model guest bindings
#
# Generates the exported `witan:gossip/gossip-world` interface from
# wit/gossip-protocol.wit. See src/component.rs for the Guest implementation.
# Optional so that `default-features = false` gives library consumers the plain
# rlib without this crate's component export welded onto their world.
# ---------------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.61", optional = true }

# ---------------------------------------------------------------------------
# Native-only dependencies (integration tests, benchmarks)
# ---------------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# getrandom uses OS entropy automatically on native
getrandom = { version = "0.2" }

# QUIC transport for native integration tests
quinn = { version = "0.11", optional = true }

# TLS for QUIC (native only)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

# Self-signed cert generation for test QUIC endpoints
rcgen = { version = "0.14", optional = true }

# Async runtime for native integration tests
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"], optional = true }

# ---------------------------------------------------------------------------
# Dev dependencies (tests only, native)
# ---------------------------------------------------------------------------
[dev-dependencies]

# Property-based testing
proptest = "1.4"

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
[features]
default = ["component"]

# Export the WASM Component Model interface (`witan:gossip/gossip-protocol`)
# on wasm32 targets. On by default, so building this crate for wasm32-wasip2
# produces a usable component with no extra flags.
#
# Turn it OFF (`default-features = false`) when depending on this crate as a
# *library* from your own wasm component. The export is emitted by an
# `export!` macro, and a dependency's exports are merged into the root crate's
# world — so leaving it on adds `witan:gossip/gossip-protocol` to YOUR
# component's public surface whether or not you want to expose it.
#
# Kept default-on deliberately: the opposite default fails silently, producing
# a "component" with no gossip export that only breaks when a host tries to
# instantiate it.
component = ["dep:wit-bindgen"]

# DEPRECATED — legacy hand-rolled C-ABI exports (`gossip_*_wasi`) for
# wasm32-wasip1 core-module hosts. Superseded by the WASM Component Model
# interface, which is the default and needs no feature flag. Retained only for
# consumers that integrated against the raw ptr/len ABI before the component
# export existed; scheduled for removal in a future release (CRA ticket).
wasi-abi = []

# Enable native QUIC/TCP transport for integration tests
native-transport = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:tokio"]

# Build profiles live in the workspace root Cargo.toml — cargo ignores
# `[profile.*]` set in a member package.
