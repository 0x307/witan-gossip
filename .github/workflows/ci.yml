name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p witan-gossip
      - run: cargo test -p witan-gossip

  # The component build and the downstream consumer that drives it. This is the
  # job that proves the WASM Component Model claim: a crate that builds is not
  # the same as a component a host can actually instantiate and call.
  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: cargo build -p witan-gossip --target wasm32-wasip2 --release

      - name: artifact is a valid component
        run: wasm-tools validate --features all target/wasm32-wasip2/release/witan_gossip.wasm

      - name: component exports the gossip interface
        run: |
          wasm-tools component wit target/wasm32-wasip2/release/witan_gossip.wasm \
            | grep -q 'export witan:gossip/gossip-protocol@0.1.0;'

      - name: downstream-consumer check (3-node wasmtime mesh)
        run: cargo run -p wasmtime-test -- target/wasm32-wasip2/release/witan_gossip.wasm

      # The `component` feature is what library consumers turn off to keep this
      # crate's export out of their own component's world. Assert the export is
      # genuinely absent, not just that the build succeeded — a gate that
      # cannot be observed failing is not a gate.
      - name: --no-default-features drops the export
        run: |
          set -euo pipefail
          cargo build -p witan-gossip --target wasm32-wasip2 --release --no-default-features
          if wasm-tools component wit target/wasm32-wasip2/release/witan_gossip.wasm \
               | grep -q 'export witan:gossip/gossip-protocol'; then
            echo "component feature is off but the interface is still exported"
            exit 1
          fi

  # The alternative build path documented in the README. Guards against the
  # docs promising a toolchain nobody exercises.
  cargo-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component,wasm-tools
      - run: cargo component build -p witan-gossip --release
      - name: adapter output is also a valid component with the same export
        run: |
          wasm-tools validate --features all target/wasm32-wasip1/release/witan_gossip.wasm
          wasm-tools component wit target/wasm32-wasip1/release/witan_gossip.wasm \
            | grep -q 'export witan:gossip/gossip-protocol@0.1.0;'

  # The deprecated C-ABI surface. Kept in CI so it cannot rot silently while it
  # is still supported, and so its removal is a deliberate act.
  legacy-wasi-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # --no-default-features isolates the deprecated surface: the legacy C-ABI
      # on its own, without the component export also being compiled in.
      - run: cargo build -p witan-gossip --target wasm32-wasip1 --release --no-default-features --features wasi-abi
      # And alongside the component export, which is how it actually ships.
      - run: cargo build -p witan-gossip --target wasm32-wasip1 --release --features wasi-abi

  dry-run-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p witan-gossip --dry-run

  # Build the PACKAGED crate — the exact bytes that go to crates.io — for
  # wasm32-wasip2, outside the workspace, the way a consumer gets it.
  #
  # This is not redundant with dry-run-publish. That job's verify step compiles
  # for the host target, where src/component.rs is cfg'd out, so it cannot see
  # anything the component path depends on. A missing `wit/` directory in the
  # package would pass every other job here and break every consumer's wasm
  # build on `cargo add`. Checking the crate we built is not the same as
  # checking the crate we ship.
  packaged-crate-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: package the crate
        run: cargo package -p witan-gossip

      - name: build the packaged crate for wasm32-wasip2
        run: |
          set -euo pipefail
          pkg="$(find target/package -maxdepth 1 -type d -name 'witan-gossip-*' | head -1)"
          test -n "$pkg" || { echo "no packaged crate directory found"; exit 1; }
          echo "building packaged crate at $pkg"
          test -f "$pkg/wit/gossip-protocol.wit" \
            || { echo "PACKAGED CRATE IS MISSING wit/ — consumers cannot build the component"; exit 1; }
          cd "$pkg"
          cargo build --target wasm32-wasip2 --release

      - name: packaged artifact is a component exporting the interface
        run: |
          set -euo pipefail
          pkg="$(find target/package -maxdepth 1 -type d -name 'witan-gossip-*' | head -1)"
          artifact="$pkg/target/wasm32-wasip2/release/witan_gossip.wasm"
          wasm-tools validate --features all "$artifact"
          wasm-tools component wit "$artifact" \
            | grep -q 'export witan:gossip/gossip-protocol@0.1.0;'
